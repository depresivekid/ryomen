// ===== Datos guardados en este teléfono =====
const KEY = "ryomen_data_v2";
const KEY_VIEJO = "ryomen_chat_v1";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function nuevaConv(titulo, auto) {
  return { id: uid(), titulo: titulo || "Nueva conversación", autotitulo: auto !== false, mensajes: [], creado: Date.now() };
}

function cargar() {
  try {
    const d = JSON.parse(localStorage.getItem(KEY));
    if (d && Array.isArray(d.convs) && d.convs.length) {
      if (typeof d.memoria !== "string") d.memoria = "";
      if (typeof d.recuerdos !== "string") d.recuerdos = "";
      return d;
    }
  } catch (e) {}
  // Primera vez: rescata el chat anterior si existía
  let viejos = [];
  try { viejos = JSON.parse(localStorage.getItem(KEY_VIEJO)) || []; } catch (e) {}
  const c = viejos.length ? nuevaConv("Conversación anterior", false) : nuevaConv();
  c.mensajes = viejos.map(m => ({ id: uid(), rol: m.rol, texto: m.texto }));
  return { convs: [c], activa: c.id, memoria: "", recuerdos: "" };
}

function guardar() { try { localStorage.setItem(KEY, JSON.stringify(datos)); } catch (e) {} }
function activa() {
  let c = datos.convs.find(x => x.id === datos.activa);
  if (!c) { c = datos.convs[0]; datos.activa = c.id; }

// ===== Ventana para editar texto =====
let modalCb = null;
function pedirTexto(titulo, valor, cb, ayuda, filas) {
  $("modalTitulo").textContent = titulo;
  $("modalAyuda").textContent = ayuda || "";
  $("modalAyuda").style.display = ayuda ? "block" : "none";
  $("modalInput").rows = filas || 5;
  $("modalInput").value = valor || "";
  modalCb = cb;
  $("modal").classList.add("on");
  setTimeout(() => $("modalInput").focus(), 50);
}
function cerrarModal() { $("modal").classList.remove("on"); modalCb = null; }
$("modalNo").addEventListener("click", cerrarModal);
$("modalOk").addEventListener("click", () => { const cb = modalCb, v = $("modalInput").value; cerrarModal(); if (cb) cb(v); });

// ===== Pintar chat =====
function pintar(bajar) {
  const c = activa();
  subtitulo.textContent = "Online · " + c.titulo;
  chat.innerHTML = "";
  if (!c.mensajes.length) {
    const v = document.createElement("div");
    v.className = "vacio";
    v.textContent = "Aquí no hay nada todavía.\nEscríbele algo a Сукуна.";
    v.style.whiteSpace = "pre-line";
    chat.appendChild(v);
  }
  c.mensajes.forEach(m => {
    const d = document.createElement("div");
    d.className = "msg " + (m.rol === "user" ? "user" : "model") + (m.id === seleccionado ? " sel" : "");
    const t = document.createElement("div");
    t.innerHTML = formatear(m.texto);
    d.appendChild(t);
    if (m.id === seleccionado) {
      const a = document.createElement("div");
      a.className = "acciones";
      const b1 = document.createElement("button"); b1.textContent = "✎ Editar";
      const b2 = document.createElement("button"); b2.textContent = "🗑 Borrar";
      const b3 = document.createElement("button"); b3.textContent = "⧉ Copiar";
      b1.addEventListener("click", e => { e.stopPropagation(); editarMensaje(m); });
      b2.addEventListener("click", e => { e.stopPropagation(); borrarMensaje(m); });
      b3.addEventListener("click", e => { e.stopPropagation(); copiarMensaje(m, b3); });
      a.append(b1, b2, b3);
      d.appendChild(a);
    }
    d.addEventListener("click", () => { seleccionado = (seleccionado === m.id ? null : m.id); pintar(false); });
    chat.appendChild(d);
  });
  if (bajar !== false) chat.scrollTop = chat.scrollHeight;
  refrescarIndicador();
}

function editarMensaje(m) {
  pedirTexto("Editar mensaje", m.texto, v => {
    if (v.trim()) { m.texto = v.trim(); guardar(); }
    seleccionado = null; pintar(false);
  });
}
function borrarMensaje(m) {
  if (!confirm("¿Borrar este mensaje?")) return;
  const c = activa();
  c.mensajes = c.mensajes.filter(x => x.id !== m.id);
  seleccionado = null; guardar(); pintar(false);
}
function copiarMensaje(m, btn) {
  try { navigator.clipboard.writeText(m.texto); btn.textContent = "✓ Copiado"; }
  catch (e) { btn.textContent = "No se pudo"; }
}

// ===== Menú lateral y conversaciones =====
function abrirMenu() { pintarLista(); document.body.classList.add("menu"); }
function cerrarMenu() { document.body.classList.remove("menu"); }
$("btnMenu").addEventListener("click", abrirMenu);
$("cerrarMenu").addEventListener("click", cerrarMenu);
$("velo").addEventListener("click", cerrarMenu);

function pintarLista() {
  const lista = $("lista");
  lista.innerHTML = "";
  datos.convs.forEach(c => {
    const fila = document.createElement("div");
    fila.className = "conv" + (c.id === datos.activa ? " act" : "");
    const n = document.createElement("div");
    n.className = "nombre"; n.textContent = c.titulo;
    n.addEventListener("click", () => { cambiarA(c.id); });
    const r = document.createElement("button"); r.textContent = "✎"; r.setAttribute("aria-label", "Renombrar");
    const x = document.createElement("button"); x.textContent = "🗑"; x.setAttribute("aria-label", "Borrar");
    r.addEventListener("click", () => renombrarConv(c));
    x.addEventListener("click", () => borrarConv(c));
    fila.append(n, r, x);
    lista.appendChild(fila);
  });
}

function cambiarA(id) {
  datos.activa = id; seleccionado = null; guardar();
  cerrarMenu(); quitarError(); pintar(true);
}
function crearConv() {
  const c = nuevaConv();
  datos.convs.unshift(c);
  datos.activa = c.id; seleccionado = null; guardar();
  cerrarMenu(); quitarError(); pintar(true);
  input.focus();
}
function renombrarConv(c) {
  pedirTexto("Renombrar conversación", c.titulo, v => {
    if (v.trim()) { c.titulo = v.trim().slice(0, 60); c.autotitulo = false; guardar(); pintarLista(); pintar(false); }
  }, "", 2);
}
function borrarConv(c) {
  if (!confirm("¿Borrar la conversación «" + c.titulo + "» y todos sus mensajes?")) return;
  datos.convs = datos.convs.filter(x => x.id !== c.id);
  if (!datos.convs.length) datos.convs.push(nuevaConv());
  if (datos.activa === c.id) datos.activa = datos.convs[0].id;
  seleccionado = null; guardar(); pintarLista(); pintar(true);
}
$("btnNueva").addEventListener("click", crearConv);
$("nuevaGrande").addEventListener("click", crearConv);

// ===== Memoria compartida (manual) =====
$("btnMemoria").addEventListener("click", () => {
  pedirTexto("Memoria compartida", datos.memoria, v => { datos.memoria = v.trim(); guardar(); },
    "Lo que escribas aquí lo sabrá Сукуна en TODAS las conversaciones (tu nombre, tus gustos, tu nivel de japonés, tus metas…).", 9);
});

// ===== Recuerdos de Sukuna (automáticos) =====
$("btnRecuerdos").addEventListener("click", () => {
  pedirTexto("Recuerdos de Sukuna", datos.recuerdos, v => { datos.recuerdos = v.trim(); guardar(); },
    "Notas que Сукуна va escribiendo solo mientras conversan. Puedes corregirlas, borrar líneas o vaciar todo.", 12);
});
$("btnRecordarAhora").addEventListener("click", () => {
  cerrarMenu();
  extraerRecuerdos(activa(), true);
});

async function extraerRecuerdos(conv, forzar) {
  if (extrayendo) { if (forzar) aviso("Ya estoy actualizando los recuerdos…"); return; }

  let desde = typeof conv.extraidoHasta === "number" ? conv.extraidoHasta : Math.max(0, conv.mensajes.length - 10);
  if (desde > conv.mensajes.length) desde = conv.mensajes.length;
  const nuevos = conv.mensajes.slice(desde);
  const minimo = forzar ? 2 : 6;
  if (nuevos.length < minimo) {
    if (forzar) aviso("Todavía no hay mensajes nuevos que recordar.");
    return;
  }

  extrayendo = true;
  if (forzar) aviso("🧠 Сукуна está repasando la conversación…");
  const hasta = conv.mensajes.length;
  const dialogo = nuevos.slice(-20).map(m => (m.rol === "user" ? "ELLA" : "SUKUNA") + ": " + m.texto).join("\n\n");
  const hoy = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  const pedido = "FECHA DE HOY: " + hoy +
    "\n\nNOTAS ACTUALES:\n" + (datos.recuerdos || "(todavía no hay notas)") +
    "\n\nCONVERSACIÓN NUEVA:\n" + dialogo +
    "\n\nDevuelve la lista completa y actualizada de notas.";

  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: pedido, history: [], personaje: INSTRUCCION_MEMORIA })
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || data.error || !data.reply) throw new Error(data.error || ("código " + r.status));

    let t = String(data.reply).trim().replace(/^```[a-z]*\n?/i, "").replace(/```$/, "").trim();
    const anterior = datos.recuerdos || "";

    if (t.length < 5) throw new Error("respuesta vacía");
    // Protección: si de golpe se borra casi todo, se ignora
    if (anterior.length > 400 && t.length < anterior.length * 0.4) throw new Error("la actualización borraba demasiado");

    t = t.slice(0, 4000);
    if (t !== anterior) {
      datos.recuerdos = t;
      aviso("🧠 Сукуна запомнил что-то");
    } else if (forzar) {
      aviso("Nada nuevo que recordar.");
    }
    conv.extraidoHasta = hasta;
    guardar();
  } catch (e) {
    if (forzar) aviso("No se pudo actualizar: " + e.message);
  } finally {
    extrayendo = false;
  }
}

// ===== Enviar mensaje =====
async function enviar() {
  const texto = input.value.trim();
  if (!texto || ocupado) return;
  quitarError();
  seleccionado = null;

  const conv = activa();
  const historial = conv.mensajes.slice(-30).map(m => ({
    role: m.rol === "user" ? "user" : "model",
    parts: [{ text: m.texto }]
  }));
  const msg = { id: uid(), rol: "user", texto };
  conv.mensajes.push(msg);
  if (conv.autotitulo) { conv.titulo = texto.slice(0, 32) + (texto.length > 32 ? "…" : ""); conv.autotitulo = false; }
  guardar();

  input.value = ""; ajustarAlto();
  ocupado = true; convEnviando = conv.id; boton.disabled = true;
  pintar(true);

  const hoy = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
  let personaje = PERSONALIDAD + "\n\nТекущая дата: " + hoy + ".";
  if (datos.memoria) {
    personaje += "\n\n11. Общая память (то, что собеседница сама рассказала о себе; это общее для всех разговоров):\n" + datos.memoria;
  }
  if (datos.recuerdos) {
    personaje += "\n\n12. Твои заметки о собеседнице и о вашей общей истории (ты составил их сам по прошлым разговорам; пользуйся ими естественно, не пересказывай списком и не выдумывай сверх них):\n" + datos.recuerdos;
  }

  let ok = false;
  try {
    const r = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: texto, history: historial, personaje })
    });
    let data = {};
    try { data = await r.json(); } catch (e) {}
    if (!r.ok || data.error) throw new Error(data.error || ("El Worker respondió con código " + r.status));
    conv.mensajes.push({ id: uid(), rol: "model", texto: data.reply });
    guardar();
    ok = true;
  } catch (e) {
    conv.mensajes = conv.mensajes.filter(x => x.id !== msg.id);
    guardar();
    if (datos.activa === conv.id) { input.value = texto; ajustarAlto(); }
    mostrarError("No pude hablar con Sukuna: " + e.message);
  } finally {
    ocupado = false; convEnviando = null; boton.disabled = false;
    if (datos.activa === conv.id) pintar(true); else refrescarIndicador();
  }

  // En segundo plano: cada 3 intercambios actualiza los recuerdos
  if (ok) extraerRecuerdos(conv, false);
}

form.addEventListener("submit", e => { e.preventDefault(); enviar(); });
pintar(true);
</script>
