<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0709">
<link rel="manifest" href="manifest.json">
<title>RYŌMEN</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #0b0709; color: #eadfe0;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif; }
  button { font-family: inherit; }
  #app { display: flex; flex-direction: column; height: 100dvh;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }

  header { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border-bottom: 1px solid #3a1519; background: #120a0c; }
  .icono { background: none; border: 1px solid #3a1519; color: #e8c9cc; border-radius: 10px;
    width: 42px; height: 42px; font-size: 20px; flex: none; }
  .avatar { width: 42px; height: 42px; border-radius: 10px; background: #3a0d12; flex: none;
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: #ff6b6b; }
  .titulo { flex: 1; min-width: 0; }
  .titulo b { font-size: 17px; display: block; }
  .titulo span { font-size: 12px; color: #8d7a7c; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .online { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #d63a3a; margin-right: 5px; }

  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .vacio { margin: auto; text-align: center; color: #6f5d5f; font-size: 15px; line-height: 1.5; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.model { align-self: flex-start; background: #1a0f11; border: 1px solid #3a1519; }
  .msg.user { align-self: flex-end; background: #5c1219; }
  .msg.sel { outline: 2px solid #ff6b6b; }
  .msg em { color: #ff7b7b; font-style: normal; font-weight: 600; }
  .acciones { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,.12); }
  .acciones button { background: rgba(0,0,0,.35); color: #eadfe0; border: 1px solid #5a2a30;
    border-radius: 9px; padding: 7px 11px; font-size: 13px; }

  #escribiendo { display: none; align-self: flex-start; color: #ff7b7b; font-size: 14px; padding: 0 20px 8px; }
  #escribiendo.on { display: block; }
  #escribiendo::after { content: ""; animation: puntos 1.2s infinite; }
  @keyframes puntos { 0%{content:""} 33%{content:"."} 66%{content:".."} 100%{content:"..."} }
  #error { display: none; margin: 0 16px 8px; padding: 10px 12px; border-radius: 10px;
    background: #3a0d12; border: 1px solid #8a2630; color: #ffb4b4; font-size: 14px; }
  #error.on { display: block; }

  form { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #3a1519; background: #120a0c; }
  #input { flex: 1; resize: none; max-height: 140px; background: #1a0f11; color: #eadfe0;

    font-family: inherit; outline: none; }
  #enviar { background: #8a1c25; color: white; border: none; border-radius: 14px;
    padding: 0 18px; font-size: 16px; font-weight: 600; }
  #enviar:disabled { opacity: .45; }

  /* Menú lateral */
  #velo { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; z-index: 10; }
  #panel { position: fixed; top: 0; bottom: 0; left: 0; width: 84%; max-width: 340px; z-index: 11;
    background: #120a0c; border-right: 1px solid #3a1519; transform: translateX(-100%);
    transition: transform .25s; display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  body.menu #panel { transform: none; }
  body.menu #velo { display: block; }
  .panel-top { display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid #3a1519; font-size: 18px; font-weight: 600; }
  .panel-top button { background: none; border: none; color: #c9a3a6; font-size: 24px; }
  .grande { margin: 12px 14px 4px; padding: 13px; background: #8a1c25; color: #fff; border: none;
    border-radius: 12px; font-size: 16px; font-weight: 600; }
  .secundario { margin: 6px 14px; padding: 12px; background: #1a0f11; color: #e8c9cc;
    border: 1px solid #3a1519; border-radius: 12px; font-size: 15px; text-align: left; }
  #lista { flex: 1; overflow-y: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 8px; }
  .conv { display: flex; align-items: center; gap: 6px; background: #1a0f11;
    border: 1px solid #3a1519; border-radius: 12px; padding: 4px 4px 4px 12px; }
  .conv.act { border-color: #ff6b6b; background: #2a1215; }
  .conv .nombre { flex: 1; min-width: 0; padding: 10px 0; font-size: 15px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv button { background: none; border: none; font-size: 17px; padding: 9px; color: #c9a3a6; }
  .etiqueta { margin: 10px 16px 0; font-size: 12px; color: #8d7a7c; text-transform: uppercase; letter-spacing: .06em; }

  /* Ventana para editar texto */
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; z-index: 20;
    align-items: center; justify-content: center; padding: 20px; }
  #modal.on { display: flex; }
  .caja { width: 100%; max-width: 420px; background: #160c0e; border: 1px solid #5a2a30;
    border-radius: 16px; padding: 16px; }
  .caja h3 { margin: 0 0 10px; font-size: 17px; }
  .caja .ayuda { font-size: 13px; color: #8d7a7c; margin: -4px 0 10px; line-height: 1.4; }
  .caja textarea { width: 100%; background: #1a0f11; color: #eadfe0; border: 1px solid #3a1519;
    border-radius: 12px; padding: 11px 12px; font-size: 16px; font-family: inherit; outline: none; resize: vertical; }
  .botones { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .botones button { padding: 10px 16px; border-radius: 10px; font-size: 15px; border: 1px solid #3a1519;
    background: #1a0f11; color: #eadfe0; }
  .botones .ok { background: #8a1c25; border-color: #8a1c25; color: #fff; font-weight: 600; }

  /* Aviso pequeño */
  #aviso { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 30;
    background: #2a1215; border: 1px solid #8a2630; color: #ffd0d0; padding: 9px 14px;
    border-radius: 12px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 90%; text-align: center; }
  #aviso.on { opacity: 1; }
</style>
</head>
