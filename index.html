<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#100d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="RYŌMEN"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>RYŌMEN</title>
<style>
:root{color-scheme:dark;--bg:#100d10;--panel:#191419;--panel2:#211920;--line:#382831;--red:#a83243;--red2:#d15b68;--text:#f2e9e9;--muted:#a99ba1;--gold:#c5a16c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#39202b 0%,var(--bg) 48%);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,textarea,input{font:inherit}button{color:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 12px;border-bottom:1px solid var(--line)}.brand{letter-spacing:.22em;font:600 18px Georgia,serif}.brand span{color:var(--red2)}.sub{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:2px}.iconbtn{background:transparent;border:1px solid var(--line);border-radius:12px;padding:9px 11px}.hero{text-align:center;padding:22px 10px 17px}.sigil{width:72px;height:72px;border:1px solid #75404c;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:var(--red2);font:32px Georgia,serif;box-shadow:0 0 35px #7b273522,inset 0 0 20px #7b273522}.hero h1{font:26px Georgia,serif;font-weight:400;margin:0}.hero p{margin:5px 0 0;color:var(--muted);font-size:12px;letter-spacing:.08em}.status{display:inline-flex;align-items:center;gap:7px;margin-top:12px;color:#b9a8ad;font-size:11px}.dot{width:6px;height:6px;border-radius:50%;background:#8b3946;box-shadow:0 0 8px #c34b5c}.chat{flex:1;overflow:auto;padding:6px 0 18px;scroll-behavior:smooth}.msg{max-width:88%;margin:12px 0;padding:13px 15px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.ai{background:linear-gradient(145deg,#211920,#191419);border:1px solid #3a2831;border-top-left-radius:4px}.msg.user{margin-left:auto;background:#49232d;border:1px solid #713541;border-top-right-radius:4px}.who{font:11px Georgia,serif;letter-spacing:.12em;color:var(--gold);margin-bottom:6px}.msg.user .who{color:#e5b7bd}.typing{color:var(--muted);font-style:italic}.composer{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 22%)}.entry{display:flex;align-items:end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px}.entry textarea{flex:1;resize:none;max-height:130px;min-height:40px;background:transparent;border:0;outline:0;color:var(--text);padding:9px 6px}.send,.mic{border:0;border-radius:13px;width:42px;height:42px;background:var(--red);display:grid;place-items:center;font-size:18px}.mic{background:#30232b;border:1px solid var(--line)}.hint{text-align:center;color:#766970;font-size:10px;margin-top:8px}.toolbar{display:flex;gap:8px;justify-content:center;margin-top:10px}.toolbar button{background:transparent;border:0;color:var(--muted);font-size:11px;padding:5px 8px}.panel{position:fixed;inset:0;background:#0009;display:none;align-items:end;z-index:5}.panel.open{display:flex}.sheet{width:100%;max-width:760px;margin:auto;background:#1a141a;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:85dvh;overflow:auto}.sheet h2{font:22px Georgia,serif;font-weight:400;margin:0 0 14px}.sheet label{display:block;color:var(--muted);font-size:12px;margin:13px 0 6px}.sheet textarea,.sheet input{width:100%;background:#100d10;border:1px solid var(--line);border-radius:12px;padding:11px;color:var(--text)}.sheet textarea{min-height:105px}.actions{display:flex;gap:9px;margin-top:15px}.actions button{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:#30212a}.actions .primary{background:var(--red);border-color:var(--red)}.memoryitem{padding:10px;border:1px solid var(--line);border-radius:10px;margin:7px 0;color:#ddd}.small{font-size:11px;color:var(--muted)}
</style></head>
<body><main class="app"><header><div><div class="brand">RYŌ<span>MEN</span></div><div class="sub">A PERSONAL CURSE</div></div><button class="iconbtn" id="settings" aria-label="Настройки">☷</button></header>
<section class="hero"><div class="sigil">呪</div><h1>Ryōmen Sukuna</h1><p>Король проклятий · эпоха Хэйан</p><div class="status"><i class="dot"></i> Личная сессия</div></section>
<section class="chat" id="chat" aria-live="polite"></section>
<div class="composer"><div class="entry"><button class="mic" id="mic" title="Голосовой ввод">🎙</button><textarea id="input" rows="1" placeholder="Обратись ко мне…"></textarea><button class="send" id="send" title="Отправить">➤</button></div><div class="hint" id="hint">Локальный прототип · переписка хранится на этом устройстве</div><div class="toolbar"><button id="speakLast">◖ Озвучить последний ответ</button><button id="memories">Память</button><button id="clear">Новый разговор</button></div></div></main>
<div class="panel" id="panel"><div class="sheet"><h2 id="sheetTitle">Настройки</h2><div id="sheetBody"></div><div class="actions"><button id="close">Закрыть</button><button class="primary" id="save">Сохранить</button></div></div></div>
<script>
const KEY='ryomen_v01';const defaults={persona:'Рёмен Сукуна — древнее проклятие эпохи Хэйан, самоуверенный, жестокий, проницательный и независимый. Он не стремится понравиться собеседнице и не становится покладистым романтическим партнёром. Его речь язвительна, властна, умна; он любит проверять людей, замечает слабости и противоречия, обладает чёрным юмором. Не смягчай его характер без причины. Отношения развиваются медленно и только через взаимодействие.',memories:[],messages:[]};let data={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};let lastAI='';
const chat=document.getElementById('chat'),input=document.getElementById('input');function persist(){localStorage.setItem(KEY,JSON.stringify(data))}function addMsg(role,text,save=true){let d=document.createElement('div');d.className='msg '+(role==='user'?'user':'ai');let who=document.createElement('div');who.className='who';who.textContent=role==='user'?'ТЫ':'RYŌMEN SUKUNA';let body=document.createElement('div');body.textContent=text;d.append(who,body);chat.append(d);chat.scrollTop=chat.scrollHeight;if(role==='ai')lastAI=text;if(save){data.messages.push({role,text});persist()}}
function render(){chat.innerHTML='';if(!data.messages.length){addMsg('ai','Хм. Ещё один человек, осмелившийся потревожить мой покой.\n\n*Четыре алых глаза внимательно изучают тебя.*\n\nГовори. Чем собираешься меня развлечь?',false)}else data.messages.forEach(m=>addMsg(m.role,m.text,false))}render();
function localReply(q){const s=q.toLowerCase();if(/кто ты|как тебя зовут/.test(s))return 'Ты задаёшь вопросы, ответы на которые должен был бы знать. Я — Рёмен Сукуна. Запомни это имя.';if(/привет|здравствуй|доброе/.test(s))return 'Хм. Решила заговорить со мной? Не заставляй меня жалеть об этом. Что тебе нужно?';if(/скучал|соскуч/.test(s))return 'Не льсти себе. Моё время не принадлежит тебе. *На губах появляется едва заметная усмешка.* Хотя ты снова здесь — занятное постоянство.';if(/любишь|любовь/.test(s))return 'Любовь? Слабое слово, которым люди пытаются придать смысл своей привязанности. Объясни, почему тебя интересует моё мнение.';if(/почему|зачем/.test(s))return 'Ты хочешь причину? Тогда сформулируй вопрос точнее. Я не собираюсь разгадывать то, что ты сама не сумела выразить.';return 'Ха. Любопытно. Продолжай. Я хочу понять, к чему ты клонишь.'}
function send(){let q=input.value.trim();if(!q)return;addMsg('user',q);input.value='';let t=document.createElement('div');t.className='msg ai typing';t.textContent='Сукуна обдумывает ответ…';chat.append(t);chat.scrollTop=chat.scrollHeight;setTimeout(()=>{t.remove();let reply=localReply(q);addMsg('ai',reply);},550)}document.getElementById('send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,130)+'px'});
function speak(text){if(!('speechSynthesis'in window)){alert('Озвучивание не поддерживается этим браузером.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.92;u.pitch=.78;speechSynthesis.speak(u)}document.getElementById('speakLast').onclick=()=>lastAI&&speak(lastAI);
const panel=document.getElementById('panel'),body=document.getElementById('sheetBody'),title=document.getElementById('sheetTitle');let mode='settings';function openSheet(m){mode=m;panel.classList.add('open');if(m==='settings'){title.textContent='Настройки Сукуны';body.innerHTML=`<label>Личность и правила поведения</label><textarea id="personaEdit"></textarea><p class="small">Это базовый профиль персонажа. Сейчас он влияет на будущую интеграцию с настоящей ИИ-моделью; демонстрационные ответы пока работают по локальным шаблонам.</p>`;document.getElementById('personaEdit').value=data.persona;document.getElementById('save').style.display='block'}else{title.textContent='Память';body.innerHTML=`<p class="small">Локальные заметки о важных фактах и событиях. Пока добавляются вручную.</p><label>Новая заметка</label><textarea id="memoryEdit" placeholder="Например: важное событие, обещание, деталь вашей истории…"></textarea><div id="memoryList"></div>`;let list=document.getElementById('memoryList');data.memories.forEach((m,i)=>{let x=document.createElement('div');x.className='memoryitem';x.textContent=m;list.append(x)});document.getElementById('save').style.display='block'}}document.getElementById('settings').onclick=()=>openSheet('settings');document.getElementById('memories').onclick=()=>openSheet('memory');document.getElementById('close').onclick=()=>panel.classList.remove('open');document.getElementById('save').onclick=()=>{if(mode==='settings'){data.persona=document.getElementById('personaEdit').value}else{let v=document.getElementById('memoryEdit').value.trim();if(v)data.memories.push(v)}persist();panel.classList.remove('open')};document.getElementById('clear').onclick=()=>{if(confirm('Начать новый разговор? История будет очищена, заметки памяти сохранятся.')){data.messages=[];persist();render()}};
let rec=null;const mic=document.getElementById('mic');mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Голосовой ввод недоступен в этом браузере на iPhone. Можно использовать диктовку клавиатуры iOS.');return}if(rec){rec.stop();rec=null;mic.textContent='🎙';return}rec=new SR();rec.lang='ru-RU';rec.interimResults=false;rec.onresult=e=>{input.value+=(input.value?' ':'')+e.results[0][0].transcript};rec.onend=()=>{rec=null;mic.textContent='🎙'};mic.textContent='■';rec.start()};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
